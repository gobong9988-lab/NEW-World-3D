<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>오닐의 실린더 3D 월드 — O'Neill Cylinder Cinematic MV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/index-4y6hHcTX.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CpYCaizL.css">
</head>
<body class="bg-slate-950 text-white overflow-hidden select-none">
  <!-- Main WebGL Canvas Container -->
  <div id="canvas-container" class="fixed inset-0 w-full h-full"></div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/92 backdrop-blur-md transition-opacity duration-700">
    <div class="w-full max-w-md px-8 py-7 rounded-2xl bg-slate-900/80 border border-white/10 shadow-2xl text-center">
      <div class="mx-auto mb-4 w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-300 via-amber-400 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/30">
        <span class="text-slate-950 font-extrabold text-xl tracking-tight">O'N</span>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white mb-1">오닐의 실린더 3D 월드</h1>
      <p id="loading-status" class="text-xs text-slate-300 mb-5">3D 에셋 및 PBR 텍스처 초기화 중...</p>
      <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden mb-2">
        <div id="loading-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-amber-400 via-yellow-300 to-emerald-400 transition-all duration-300"></div>
      </div>
      <div class="flex justify-between text-[11px] text-slate-400">
        <span id="loading-detail">HDRI · PBR · GLB 파이프라인</span>
        <span id="loading-percent" class="font-semibold text-amber-300">0%</span>
      </div>
    </div>
  </div>

  <!-- HUD Layer (Glassmorphism) -->
  <div id="hud-root" class="pointer-events-none fixed inset-0 z-20 flex flex-col justify-between p-4 sm:p-5 transition-opacity duration-300">
    <!-- Top Row -->
    <div class="flex flex-wrap items-start justify-between gap-3">
      <!-- Brand Card -->
      <div class="pointer-events-auto glass-panel flex items-center gap-3.5 px-4 py-3 rounded-2xl">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-300 via-amber-400 to-orange-500 flex items-center justify-center shadow-md shadow-amber-500/25 shrink-0">
          <span class="text-slate-950 font-extrabold text-sm tracking-tight">O'N</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-bold tracking-tight text-white">오닐의 실린더 3D 월드</h1>
            <span class="px-2 py-0.5 text-[10px] font-bold tracking-wider uppercase rounded-full bg-emerald-400/20 text-emerald-300 border border-emerald-400/35">CINEMATIC</span>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-300/90 mt-0.5">IBL 골든아워 · PBR 지형 · 4,800+ 숲 · 목초지 &amp; 새 비행</p>
        </div>
      </div>

      <!-- Telemetry Pill -->
      <div class="pointer-events-auto glass-panel flex items-center gap-3.5 sm:gap-4 px-4 py-2.5 rounded-full text-xs">
        <div class="flex items-center gap-1.5">
          <span id="fps-dot" class="w-2 h-2 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400/70"></span>
          <span class="text-slate-400">FPS</span>
          <span id="stat-fps" class="font-bold text-emerald-300 tabular-nums w-6 text-right">60</span>
        </div>
        <div class="h-3.5 w-px bg-white/15"></div>
        <div class="flex items-center gap-1.5">
          <span class="text-slate-400">나무</span>
          <span id="stat-trees" class="font-bold text-amber-300 tabular-nums">0</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-slate-400">마을</span>
          <span id="stat-buildings" class="font-bold text-sky-300 tabular-nums">0</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-slate-400">생명체</span>
          <span id="stat-wildlife" class="font-bold text-violet-300 tabular-nums">0</span>
        </div>
      </div>
    </div>

    <!-- Bottom Controls Dock -->
    <div class="flex flex-col items-center gap-2.5">
      <!-- Active Camera Caption + Secondary Controls -->
      <div class="pointer-events-auto flex flex-wrap items-center justify-center gap-2">
        <div id="camera-caption" class="glass-pill px-3.5 py-1.5 rounded-full text-[11px] text-slate-200/95">
          파노라마 전경 — 360° 무봉제 오닐 실린더 중심축 시네마틱 뷰
        </div>
        <button id="btn-autopilot" type="button" class="glass-pill px-3 py-1.5 rounded-full text-[11px] font-medium text-amber-200 hover:bg-white/15 transition cursor-pointer flex items-center gap-1.5" title="카메라 자동 무빙 켜기/끄기 (Space)">
          <span id="autopilot-dot" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
          <span id="autopilot-label">자동 무빙 ON</span>
        </button>
        <button id="btn-toggle-hud" type="button" class="glass-pill px-3 py-1.5 rounded-full text-[11px] text-slate-300 hover:text-white hover:bg-white/15 transition cursor-pointer" title="HUD 숨기기/보이기 (H)">
          HUD 숨김 (H)
        </button>
      </div>

      <!-- Main Camera Preset Bar (6 Cinematic Views) -->
      <div class="pointer-events-auto glass-panel flex flex-wrap items-center justify-center gap-1.5 p-2 rounded-2xl max-w-full">
        <button data-preset="0" class="cam-btn active" type="button">
          <span>🏞️</span><span>파노라마 전경</span>
        </button>
        <button data-preset="1" class="cam-btn" type="button">
          <span>🐦</span><span>새의 시선 (POV)</span>
        </button>
        <button data-preset="2" class="cam-btn" type="button">
          <span>🦅</span><span>매의 시선 (고공)</span>
        </button>
        <button data-preset="3" class="cam-btn" type="button">
          <span>🌊</span><span>강변 저공비행</span>
        </button>
        <button data-preset="4" class="cam-btn" type="button">
          <span>🏡</span><span>마을 &amp; 목초지</span>
        </button>
        <button data-preset="5" class="cam-btn" type="button">
          <span>🚀</span><span>우주 외부</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Minimal Floating Restore Pill (shown only when HUD is hidden) -->
  <div id="hud-restore-pill" class="hidden fixed bottom-4 right-4 z-30 flex items-center gap-2">
    <button id="btn-show-hud" type="button" class="px-3 py-2 rounded-full bg-slate-900/75 hover:bg-slate-800/90 border border-white/15 text-slate-200 text-xs backdrop-blur-md cursor-pointer">
      HUD 보이기 (H)
    </button>
  </div>

</body>
</html>
